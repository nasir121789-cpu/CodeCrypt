<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Web App</title>
    <!-- Firebase SDK (Lightweight & Fast) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        
        /* সম্পূর্ণ স্ক্রিন জুড়ে থাকা খালি বাক্স */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 🎨 ২ সেকেন্ডের সাদা স্ক্রিন দূর করার জন্য স্মার্ট লোডার */
        #appLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a; /* ব্যাকগ্রাউন্ড কালার আপনার পছন্দমতো দিতে পারেন */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 🌟 সাদা স্ক্রিন বন্ধ করার জন্য লোডার অ্যানিমেশন -->
    <div id="appLoader">
        <div class="spinner"></div>
    </div>

    <!-- 🕵️ চোরের দেখা একমাত্র খালি বাক্স -->
    <iframe id="liveFrame"></iframe>

<script>
    const liveFrame = document.getElementById("liveFrame");
    const loader = document.getElementById("appLoader");

    // ⚡ ১. সুপার স্পিড ক্যাশ: মেমোরিতে আগে থেকে সেভ থাকা কোড থাকলে ০ সেকেন্ডে রেন্ডার হবে
    const cachedCode = localStorage.getItem("cached_website_code");
    if (cachedCode) {
        renderCode(cachedCode);
        hideLoader(); // আগের কোড থাকলে সাথে সাথে লোডার গায়েব হয়ে যাবে
    }

    // ⚠️ আপনার Firebase কনফিগারেশন দিন
    const firebaseConfig = {
  apiKey: "AIzaSyBwdAEMuKsGzz7oWLSkO2WDl83yzdXdrig",
  authDomain: "website-edit-881e5.firebaseapp.com",
  databaseURL: "https://website-edit-881e5-default-rtdb.firebaseio.com",
  projectId: "website-edit-881e5",
  storageBucket: "website-edit-881e5.firebasestorage.app",
  messagingSenderId: "420995191968",
  appId: "1:420995191968:web:5a566742f01405811a25c5"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ⚡ ২. ব্যাকগ্রাউন্ডে ফায়ারবেস থেকে নতুন আপডেট চেক করা
    database.ref('cloudWebsiteCode').on('value', (snapshot) => {
        const newCode = snapshot.val();
        if (newCode) {
            // যদি এডমিন প্যানেল থেকে নতুন কোড দেওয়া হয় বা ক্যাশে যা ছিল তার সাথে না মেলে
            if (newCode !== cachedCode) {
                localStorage.setItem("cached_website_code", newCode);
                renderCode(newCode);
            }
            hideLoader(); // লোডার সম্পূর্ণ বন্ধ করা
        }
    });

    // আইফ্রেমের ভেতরে কোড ডিসপ্লে করার ফাংশন
    function renderCode(code) {
        const frameDoc = liveFrame.contentDocument || liveFrame.contentWindow.document;
        frameDoc.open();
        frameDoc.write(code);
        frameDoc.close();
    }

    // লোডার বন্ধ করার স্মুথ অ্যানিমেশন
    function hideLoader() {
        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => {
                loader.style.visibility = "hidden";
            }, 400);
        }
    }
</script>

</body>
</html>
